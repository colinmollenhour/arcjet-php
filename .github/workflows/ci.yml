name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            dependencies: locked
          - php: '8.5'
            dependencies: locked
          - php: '8.4'
            dependencies: lowest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, libxml, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        if: matrix.dependencies == 'locked'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Resolve lowest supported dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Verify runtime requirements
        run: composer check-platform-reqs

      - name: Audit dependencies
        run: composer audit --locked --no-interaction

      - name: Check package
        run: composer check

      - name: Install pinned protocol build tools
        if: matrix.php == '8.4' && matrix.dependencies == 'locked'
        run: |
          curl --fail --silent --show-error --location --max-time 120 \
            https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip \
            --output "$RUNNER_TEMP/protoc.zip"
          echo "121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278  $RUNNER_TEMP/protoc.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          python3 -m venv "$RUNNER_TEMP/arcjet-proto-venv"
          "$RUNNER_TEMP/arcjet-proto-venv/bin/python" -m pip install -r tools/proto/requirements.txt

      - name: Verify protocol generation and both wire directions
        if: matrix.php == '8.4' && matrix.dependencies == 'locked'
        run: |
          "$RUNNER_TEMP/arcjet-proto-venv/bin/python" tools/proto/generate.py \
            --protoc "$RUNNER_TEMP/protoc/bin/protoc" --check --verify-php
          "$RUNNER_TEMP/arcjet-proto-venv/bin/python" -m unittest discover -s tools/proto -p 'test_*.py'
